<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="show-algo-dropdown" content="false"/>
<title>SHA-256 Calculator</title>
<style>
  html, body { height: 100%; margin: 0; padding: 0; }
  * { box-sizing: border-box; }
  body { font-family: system-ui, sans-serif; background: #f0f2f5; display: flex; justify-content: center; align-items: flex-start; min-height: 100%; padding: 10px 0; margin: 0; }
  .container { background: #fff; padding: 1.5rem; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); width: 90%; max-width: 680px; }
  h1 { font-size: 1.3rem; margin-bottom: 1rem; text-align: center; color: #1a1a2e; }
  label { display: block; font-weight: 600; margin-bottom: 0.3rem; color: #333; }
  .dropzone { width: 100%; padding: 1.5rem; border: 2px dashed #aaa; border-radius: 8px; text-align: center; color: #666; cursor: pointer; margin-bottom: 0.8rem; transition: background 0.2s, border-color 0.2s; }
  .dropzone:hover, .dropzone.dragover { background: #e8f0fe; border-color: #0066ff; color: #0066ff; }
  .dropzone .file-name { margin-top: 0.5rem; font-weight: 600; color: #1a1a2e; word-break: break-all; }
  input[type="file"] { display: none; }
  textarea { width: 100%; padding: 0.6rem; border: 1px solid #ccc; border-radius: 6px; font-size: 0.9rem; font-family: monospace; margin-bottom: 1rem; resize: none; height: 3.2rem; overflow-wrap: break-word; }
  .output { margin-top: 0; padding: 0.6rem; border: 1px solid #ccc; border-radius: 6px; font-size: 0.9rem; font-family: monospace; margin-bottom: 1rem; background: #f5f5f5; min-height: 3.2rem; word-break: break-all; color: #333; }
  .result { margin-top: 1rem; padding: 0.8rem; border-radius: 6px; text-align: center; font-weight: 600; display: none; }
  .match { background: #d4edda; color: #155724; display: block; }
  .mismatch { background: #f8d7da; color: #721c24; display: block; }
  .warning { background: #fff3cd; color: #856404; display: block; }
  .buttons { display: flex; gap: 0.8rem; margin-top: 0.5rem; }
  button { flex: 1; padding: 0.7rem; border: none; border-radius: 6px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: opacity 0.2s; }
  button:hover { opacity: 0.85; }
  #verifyBtn { background: #0066ff; color: #fff; }
  #resetBtn { background: #e0e0e0; color: #333; }
  select { width: 100%; margin-bottom: 1rem; padding: 0.6rem; border: 1px solid #ccc; border-radius: 6px; font-size: 0.9rem; background: #fff; color: #333; }
  .footer { position: fixed; left: 0; bottom: 0; width: 100%; background-image: linear-gradient(to right, red, darkblue); color: white; text-align: right; }
</style>
</head>

<body>
<div class="container">
  <h1 id="pageHeading">SHA-256 Calculator</h1>

  <div id="algoSection">
    <label>Algorithm</label>
    <select id="algoSelect"></select>
  </div>

  <label>Upload File</label>
  <div class="dropzone" id="dropzone">
    <span id="dropText">Drag & drop a file here, or click to browse</span>
    <div class="file-name" id="fileName"></div>
  </div>
  <input type="file" id="fileInput" accept="*/*"/>

  <label id="expectedLabel">Expected SHA-256</label>
  <textarea id="expectedHash" placeholder="Paste expected hash here..." rows="1"></textarea>

  <label id="computedLabel">Computed SHA-256</label>
  <div class="output" id="hashOutput">Hash will appear after file upload</div>

  <div class="buttons">
    <button id="verifyBtn">Verify</button>
    <button id="resetBtn">Reset</button>
  </div>

  <div class="result" id="result"></div>
</div>

<div class="footer">
  <p><em><span>Eddie</span>&nbsp;</em></p>
</div>

<script>
const HASH_ALGORITHMS = { SHA1: "SHA-1", SHA256: "SHA-256", SHA512: "SHA-512" };
let currentAlgo = HASH_ALGORITHMS.SHA256;

const showDropdown = document.querySelector('meta[name="show-algo-dropdown"]').content === 'true';
const algoSection = document.getElementById('algoSection');
if (!showDropdown) algoSection.style.display = 'none';

const algoSelect = document.getElementById("algoSelect");
for (const [key, val] of Object.entries(HASH_ALGORITHMS)) {
  const opt = document.createElement("option");
  opt.value = val;
  opt.textContent = key;
  if (val === currentAlgo) opt.selected = true;
  algoSelect.appendChild(opt);
}

function updateLabels() {
  const name = algoSelect.options[algoSelect.selectedIndex].text;
  document.getElementById('expectedLabel').textContent = 'Expected ' + name;
  document.getElementById('computedLabel').textContent = 'Computed ' + name;
  document.title = name + ' Calculator';
  document.getElementById('pageHeading').textContent = name + ' Calculator';
}

algoSelect.addEventListener("change", e => {
  currentAlgo = e.target.value;
  updateLabels();
  document.getElementById('resetBtn').click();
});

const dropzone = document.getElementById("dropzone");
const fileInput = document.getElementById("fileInput");
const hashOutput = document.getElementById("hashOutput");
const resultEl = document.getElementById("result");
const expectedHashInput = document.getElementById("expectedHash");
const verifyBtn = document.getElementById('verifyBtn');
const resetBtn = document.getElementById('resetBtn');

verifyBtn.disabled = true;
verifyBtn.style.opacity = '0.5';
verifyBtn.style.cursor = 'not-allowed';

function setResult(text, type) {
  resultEl.textContent = text || '';
  if (!text) {
    resultEl.className = 'result';
    resultEl.style.display = 'none';
  } else {
    resultEl.className = 'result ' + (type || '');
    resultEl.style.display = 'block';
  }
}

const MAX_FILE_SIZE = 1024 * 1024 * 1024;
let isCalculating = false;
let calcSession = 0;

expectedHashInput.addEventListener("keydown", e => { if (e.key === 'Enter') e.preventDefault(); });

dropzone.addEventListener("click", () => fileInput.click());
dropzone.addEventListener("dragover", e => { e.preventDefault(); dropzone.className = 'dropzone dragover'; });
dropzone.addEventListener("dragleave", () => { dropzone.className = 'dropzone'; });
dropzone.addEventListener("drop", e => {
  e.preventDefault();
  dropzone.className = 'dropzone';
  handleFile(e.dataTransfer.files[0]);
});
fileInput.addEventListener("change", e => handleFile(e.target.files[0]));

async function handleFile(file) {
  if (!file || isCalculating) return;

  if (file.size > MAX_FILE_SIZE) {
    setResult('\u26A0 File too large. Maximum size is 1 GB.', 'warning');
    return;
  }

  isCalculating = true;
  calcSession++;
  const mySession = calcSession;
  dropzone.style.pointerEvents = 'none';
  dropzone.style.opacity = '0.5';
  expectedHashInput.value = '';
  hashOutput.textContent = 'Reading file...';
  setResult('\u23F3 Reading file...', 'warning');
  document.getElementById('fileName').textContent = file.name;

  try {
    const CHUNK = 64 * 1024 * 1024;
    let buffer;

    if (file.size <= CHUNK) {
      buffer = await file.arrayBuffer();
    } else {
      buffer = new ArrayBuffer(file.size);
      const dest = new Uint8Array(buffer);
      let offset = 0;

      while (offset < file.size) {
        if (mySession !== calcSession) return;
        const end = Math.min(offset + CHUNK, file.size);
        const chunk = await file.slice(offset, end).arrayBuffer();
        dest.set(new Uint8Array(chunk), offset);
        offset = end;
        const pct = Math.round((offset / file.size) * 100);
        setResult('\u23F3 Reading file... ' + pct + '%', 'warning');
      }
    }

    if (mySession !== calcSession) return;

    setResult('\u23F3 Hashing...', 'warning');
    hashOutput.textContent = 'Hashing...';

    await new Promise(r => setTimeout(r, 0));

    const hashBuffer = await crypto.subtle.digest(currentAlgo, buffer);
    if (mySession !== calcSession) return;

    const hashHex = Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, '0')).join('');
    hashOutput.textContent = hashHex;
    verifyBtn.disabled = false;
    verifyBtn.style.opacity = '1';
    verifyBtn.style.cursor = 'pointer';
    setResult('');
  } catch (err) {
    if (mySession !== calcSession) return;
    setResult('\u26A0 Error: ' + err.message, 'warning');
    hashOutput.textContent = 'Hash will appear after file upload';
  } finally {
    if (mySession === calcSession) {
      isCalculating = false;
      dropzone.style.pointerEvents = 'auto';
      dropzone.style.opacity = '1';
    }
  }
}

verifyBtn.addEventListener('click', () => {
  const computed = hashOutput.textContent;
  if (!computed || computed === 'Hash will appear after file upload') {
    setResult('\u26A0 Please upload a file first.', 'warning');
    return;
  }
  if (!expectedHashInput.value.trim()) {
    setResult('\u26A0 Please enter an expected hash.', 'warning');
    return;
  }
  if (computed === expectedHashInput.value.trim().toLowerCase()) {
    setResult('\u2705 Hashes match!', 'match');
  } else {
    setResult('\u274C Hashes do not match.', 'mismatch');
  }
});

resetBtn.addEventListener('click', () => {
  const wasBusy = isCalculating;
  calcSession++;
  isCalculating = false;
  dropzone.style.pointerEvents = 'auto';
  dropzone.style.opacity = '1';
  fileInput.value = '';
  expectedHashInput.value = '';
  hashOutput.textContent = 'Hash will appear after file upload';
  document.getElementById('fileName').textContent = '';
  document.getElementById('dropText').textContent = 'Drag & drop a file here, or click to browse';
  verifyBtn.disabled = true;
  verifyBtn.style.opacity = '0.5';
  verifyBtn.style.cursor = 'not-allowed';
  if (wasBusy) {
    setResult('\u26A0 Cancelling...', 'warning');
    const rs = calcSession;
    setTimeout(() => { if (rs === calcSession) setResult(''); }, 800);
  } else {
    setResult('');
  }
});
</script>
</body>
</html>
