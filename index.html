<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta http-equiv="X-UA-Compatible" content="IE=edge" />
<meta name="show-algo-dropdown" content="false"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>SHA-256 Calculator</title>
<style>
  html, body { height: 100%; margin: 0; padding: 0; }
  * { box-sizing: border-box; }
  body { font-family: system-ui, sans-serif; background: #f0f2f5; display: flex; justify-content: center; align-items: flex-start; min-height: 100%; padding: 10px 0; margin: 0; }
  .container { background: #fff; padding: 1.5rem; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); width: 90%; max-width: 680px; }
  h1 { font-size: 1.3rem; margin-bottom: 1rem; text-align: center; color: #1a1a2e; }
  label { display: block; font-weight: 600; margin-bottom: 0.3rem; color: #333; }
  .dropzone { width: 100%; padding: 1.5rem; border: 2px dashed #aaa; border-radius: 8px; text-align: center; color: #666; cursor: pointer; margin-bottom: 0.8rem; transition: background 0.2s, border-color 0.2s; }
  .dropzone:hover, .dropzone.dragover { background: #e8f0fe; border-color: #0066ff; color: #0066ff; }
  .dropzone .file-name { margin-top: 0.5rem; font-weight: 600; color: #1a1a2e; word-break: break-all; }
  input[type="file"] { display: none; }
  textarea { width: 100%; padding: 0.6rem; border: 1px solid #ccc; border-radius: 6px; font-size: 0.9rem; font-family: monospace; margin-bottom: 1rem; resize: none; height: 3.2rem; overflow-wrap: break-word; }
  .output { margin-top: 0; padding: 0.6rem; border: 1px solid #ccc; border-radius: 6px; font-size: 0.9rem; font-family: monospace; margin-bottom: 1rem; background: #f5f5f5; min-height: 3.2rem; word-break: break-all; color: #333; }
  .result { margin-top: 1rem; padding: 0.8rem; border-radius: 6px; text-align: center; font-weight: 600; display: none; }
  .match { background: #d4edda; color: #155724; display: block; }
  .mismatch { background: #f8d7da; color: #721c24; display: block; }
  .warning { background: #fff3cd; color: #856404; display: block; }
  .buttons { display: flex; gap: 0.8rem; margin-top: 0.5rem; }
  button { flex: 1; padding: 0.7rem; border: none; border-radius: 6px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: opacity 0.2s; }
  button:hover { opacity: 0.85; }
  #verifyBtn { background: #0066ff; color: #fff; }
  #resetBtn { background: #e0e0e0; color: #333; }
  select { width: 100%; margin-bottom: 1rem; padding: 0.6rem; border: 1px solid #ccc; border-radius: 6px; font-size: 0.9rem; background: #fff; color: #333; }
  .footer { position: fixed; left: 0; bottom: 0; width: 100%; background-image: linear-gradient(to right, red, darkblue); color: white; text-align: right; }
</style>
</head>

<body>
<div class="container">
  <h1 id="pageHeading">SHA-256 Calculator</h1>

  <div id="algoSection">
    <label>Algorithm</label>
    <select id="algoSelect"></select>
  </div>

  <label>Upload File</label>
  <div class="dropzone" id="dropzone">
    <span id="dropText">Drag & drop a file here, or click to browse</span>
    <div class="file-name" id="fileName"></div>
  </div>
  <input type="file" id="fileInput" accept="*/*"/>

  <label id="expectedLabel">Expected SHA-256</label>
  <textarea id="expectedHash" placeholder="Paste expected hash here..." rows="1"></textarea>

  <label id="computedLabel">Computed SHA-256</label>
  <div class="output" id="hashOutput">Hash will appear after file upload</div>

  <div class="buttons">
    <button id="verifyBtn">Verify</button>
    <button id="resetBtn">Reset</button>
  </div>

  <div class="result" id="result"></div>
</div>

<div class="footer">
  <p><em><span>Eddie</span>&nbsp;</em></p>
</div>

<script>
/**
 * ============================
 * Pure JS SHA (IE11 compatible)
 * ============================
 */
var SHAEngine = (function() {
  function toBytes(buf) {
    var u8 = new Uint8Array(buf);
    var arr = [];
    for (var i = 0; i < u8.length; i++) arr.push(u8[i]);
    return arr;
  }

  function toHex(arr) {
    var hex = '';
    for (var i = 0; i < arr.length; i++) hex += ('00' + arr[i].toString(16)).slice(-2);
    return hex;
  }

  function rr(v, n) { return (v >>> n) | (v << (32 - n)); }

  // SHA-1
  function sha1(buf) {
    var bytes = toBytes(buf);
    var len = bytes.length * 8;
    bytes.push(0x80);
    while (bytes.length % 64 !== 56) bytes.push(0);
    bytes.push(0, 0, 0, 0);
    bytes.push((len >>> 24) & 0xff, (len >>> 16) & 0xff, (len >>> 8) & 0xff, len & 0xff);

    var h0 = 0x67452301, h1 = 0xEFCDAB89, h2 = 0x98BADCFE, h3 = 0x10325476, h4 = 0xC3D2E1F0;

    for (var off = 0; off < bytes.length; off += 64) {
      var w = [];
      for (var i = 0; i < 16; i++) w[i] = (bytes[off + i*4] << 24) | (bytes[off + i*4+1] << 16) | (bytes[off + i*4+2] << 8) | bytes[off + i*4+3];
      for (var i = 16; i < 80; i++) { var t = w[i-3] ^ w[i-8] ^ w[i-14] ^ w[i-16]; w[i] = (t << 1) | (t >>> 31); }

      var a = h0, b = h1, c = h2, d = h3, e = h4;
      for (var i = 0; i < 80; i++) {
        var f, k;
        if (i < 20) { f = (b & c) | ((~b) & d); k = 0x5A827999; }
        else if (i < 40) { f = b ^ c ^ d; k = 0x6ED9EBA1; }
        else if (i < 60) { f = (b & c) | (b & d) | (c & d); k = 0x8F1BBCDC; }
        else { f = b ^ c ^ d; k = 0xCA62C1D6; }
        var tmp = (((a << 5) | (a >>> 27)) + f + e + k + w[i]) | 0;
        e = d; d = c; c = (b << 30) | (b >>> 2); b = a; a = tmp;
      }
      h0 = (h0 + a) | 0; h1 = (h1 + b) | 0; h2 = (h2 + c) | 0; h3 = (h3 + d) | 0; h4 = (h4 + e) | 0;
    }

    var out = [];
    var vals = [h0, h1, h2, h3, h4];
    for (var i = 0; i < 5; i++) out.push((vals[i] >>> 24) & 0xff, (vals[i] >>> 16) & 0xff, (vals[i] >>> 8) & 0xff, vals[i] & 0xff);
    return toHex(out);
  }

  // SHA-256
  var K256 = [
    0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,
    0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,
    0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,
    0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
    0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,
    0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
    0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
    0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2
  ];

  function sha256(buf) {
    var bytes = toBytes(buf);
    var len = bytes.length * 8;
    bytes.push(0x80);
    while (bytes.length % 64 !== 56) bytes.push(0);
    bytes.push(0, 0, 0, 0);
    bytes.push((len >>> 24) & 0xff, (len >>> 16) & 0xff, (len >>> 8) & 0xff, len & 0xff);

    var H = [0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];

    for (var off = 0; off < bytes.length; off += 64) {
      var w = [];
      for (var i = 0; i < 16; i++) w[i] = (bytes[off+i*4]<<24)|(bytes[off+i*4+1]<<16)|(bytes[off+i*4+2]<<8)|bytes[off+i*4+3];
      for (var i = 16; i < 64; i++) {
        var s0 = rr(w[i-15],7) ^ rr(w[i-15],18) ^ (w[i-15]>>>3);
        var s1 = rr(w[i-2],17) ^ rr(w[i-2],19) ^ (w[i-2]>>>10);
        w[i] = (w[i-16] + s0 + w[i-7] + s1) | 0;
      }

      var a=H[0],b=H[1],c=H[2],d=H[3],e=H[4],f=H[5],g=H[6],h=H[7];
      for (var i = 0; i < 64; i++) {
        var S1 = rr(e,6) ^ rr(e,11) ^ rr(e,25);
        var ch = (e & f) ^ ((~e) & g);
        var t1 = (h + S1 + ch + K256[i] + w[i]) | 0;
        var S0 = rr(a,2) ^ rr(a,13) ^ rr(a,22);
        var maj = (a & b) ^ (a & c) ^ (b & c);
        var t2 = (S0 + maj) | 0;
        h=g; g=f; f=e; e=(d+t1)|0; d=c; c=b; b=a; a=(t1+t2)|0;
      }
      H[0]=(H[0]+a)|0; H[1]=(H[1]+b)|0; H[2]=(H[2]+c)|0; H[3]=(H[3]+d)|0;
      H[4]=(H[4]+e)|0; H[5]=(H[5]+f)|0; H[6]=(H[6]+g)|0; H[7]=(H[7]+h)|0;
    }

    var out = [];
    for (var i = 0; i < 8; i++) out.push((H[i]>>>24)&0xff,(H[i]>>>16)&0xff,(H[i]>>>8)&0xff,H[i]&0xff);
    return toHex(out);
  }

  // SHA-512
  function Long(hi, lo) { this.h = hi|0; this.l = lo|0; }
  function add64(a, b) {
    var lo = (a.l + b.l) | 0;
    var hi = (a.h + b.h + ((lo >>> 0) < (a.l >>> 0) ? 1 : 0)) | 0;
    return new Long(hi, lo);
  }
  function rr64(x, n) {
    if (n < 32) return new Long((x.h >>> n) | (x.l << (32-n)), (x.l >>> n) | (x.h << (32-n)));
    return new Long((x.l >>> (n-32)) | (x.h << (64-n)), (x.h >>> (n-32)) | (x.l << (64-n)));
  }
  function shr64(x, n) {
    if (n < 32) return new Long(x.h >>> n, (x.l >>> n) | (x.h << (32-n)));
    return new Long(0, x.h >>> (n-32));
  }
  function xor64(a, b) { return new Long(a.h ^ b.h, a.l ^ b.l); }
  function and64(a, b) { return new Long(a.h & b.h, a.l & b.l); }
  function not64(a) { return new Long(~a.h, ~a.l); }

  var K512 = [
    [0x428a2f98,0xd728ae22],[0x71374491,0x23ef65cd],[0xb5c0fbcf,0xec4d3b2f],[0xe9b5dba5,0x8189dbbc],
    [0x3956c25b,0xf348b538],[0x59f111f1,0xb605d019],[0x923f82a4,0xaf194f9b],[0xab1c5ed5,0xda6d8118],
    [0xd807aa98,0xa3030242],[0x12835b01,0x45706fbe],[0x243185be,0x4ee4b28c],[0x550c7dc3,0xd5ffb4e2],
    [0x72be5d74,0xf27b896f],[0x80deb1fe,0x3b1696b1],[0x9bdc06a7,0x25c71235],[0xc19bf174,0xcf692694],
    [0xe49b69c1,0x9ef14ad2],[0xefbe4786,0x384f25e3],[0x0fc19dc6,0x8b8cd5b5],[0x240ca1cc,0x77ac9c65],
    [0x2de92c6f,0x592b0275],[0x4a7484aa,0x6ea6e483],[0x5cb0a9dc,0xbd41fbd4],[0x76f988da,0x831153b5],
    [0x983e5152,0xee66dfab],[0xa831c66d,0x2db43210],[0xb00327c8,0x98fb213f],[0xbf597fc7,0xbeef0ee4],
    [0xc6e00bf3,0x3da88fc2],[0xd5a79147,0x930aa725],[0x06ca6351,0xe003826f],[0x14292967,0x0a0e6e70],
    [0x27b70a85,0x46d22ffc],[0x2e1b2138,0x5c26c926],[0x4d2c6dfc,0x5ac42aed],[0x53380d13,0x9d95b3df],
    [0x650a7354,0x8baf63de],[0x766a0abb,0x3c77b2a8],[0x81c2c92e,0x47edaee6],[0x92722c85,0x1482353b],
    [0xa2bfe8a1,0x4cf10364],[0xa81a664b,0xbc423001],[0xc24b8b70,0xd0f89791],[0xc76c51a3,0x0654be30],
    [0xd192e819,0xd6ef5218],[0xd6990624,0x5565a910],[0xf40e3585,0x5771202a],[0x106aa070,0x32bbd1b8],
    [0x19a4c116,0xb8d2d0c8],[0x1e376c08,0x5141ab53],[0x2748774c,0xdf8eeb99],[0x34b0bcb5,0xe19b48a8],
    [0x391c0cb3,0xc5c95a63],[0x4ed8aa4a,0xe3418acb],[0x5b9cca4f,0x7763e373],[0x682e6ff3,0xd6b2b8a3],
    [0x748f82ee,0x5defb2fc],[0x78a5636f,0x43172f60],[0x84c87814,0xa1f0ab72],[0x8cc70208,0x1a6439ec],
    [0x90befffa,0x23631e28],[0xa4506ceb,0xde82bde9],[0xbef9a3f7,0xb2c67915],[0xc67178f2,0xe372532b],
    [0xca273ece,0xea26619c],[0xd186b8c7,0x21c0c207],[0xeada7dd6,0xcde0eb1e],[0xf57d4f7f,0xee6ed178],
    [0x06f067aa,0x72176fba],[0x0a637dc5,0xa2c898a6],[0x113f9804,0xbef90dae],[0x1b710b35,0x131c471b],
    [0x28db77f5,0x23047d84],[0x32caab7b,0x40c72493],[0x3c9ebe0a,0x15c9bebc],[0x431d67c4,0x9c100d4c],
    [0x4cc5d4be,0xcb3e42b6],[0x597f299c,0xfc657e2a],[0x5fcb6fab,0x3ad6faec],[0x6c44198c,0x4a475817]
  ];
  var K512L = [];
  for (var ki = 0; ki < 80; ki++) K512L.push(new Long(K512[ki][0], K512[ki][1]));

  function sha512(buf) {
    var bytes = toBytes(buf);
    var bitLen = bytes.length * 8;
    bytes.push(0x80);
    while (bytes.length % 128 !== 112) bytes.push(0);
    for (var p = 0; p < 12; p++) bytes.push(0);
    bytes.push((bitLen >>> 24) & 0xff, (bitLen >>> 16) & 0xff, (bitLen >>> 8) & 0xff, bitLen & 0xff);

    var H = [
      new Long(0x6a09e667,0xf3bcc908), new Long(0xbb67ae85,0x84caa73b),
      new Long(0x3c6ef372,0xfe94f82b), new Long(0xa54ff53a,0x5f1d36f1),
      new Long(0x510e527f,0xade682d1), new Long(0x9b05688c,0x2b3e6c1f),
      new Long(0x1f83d9ab,0xfb41bd6b), new Long(0x5be0cd19,0x137e2179)
    ];

    for (var off = 0; off < bytes.length; off += 128) {
      var w = [];
      for (var i = 0; i < 16; i++) {
        var hi = (bytes[off+i*8]<<24)|(bytes[off+i*8+1]<<16)|(bytes[off+i*8+2]<<8)|bytes[off+i*8+3];
        var lo = (bytes[off+i*8+4]<<24)|(bytes[off+i*8+5]<<16)|(bytes[off+i*8+6]<<8)|bytes[off+i*8+7];
        w[i] = new Long(hi, lo);
      }
      for (var i = 16; i < 80; i++) {
        var s0 = xor64(xor64(rr64(w[i-15],1), rr64(w[i-15],8)), shr64(w[i-15],7));
        var s1 = xor64(xor64(rr64(w[i-2],19), rr64(w[i-2],61)), shr64(w[i-2],6));
        w[i] = add64(add64(add64(w[i-16], s0), w[i-7]), s1);
      }

      var a=H[0],b=H[1],c=H[2],d=H[3],e=H[4],f=H[5],g=H[6],h=H[7];
      for (var i = 0; i < 80; i++) {
        var S1 = xor64(xor64(rr64(e,14), rr64(e,18)), rr64(e,41));
        var ch = xor64(and64(e,f), and64(not64(e),g));
        var t1 = add64(add64(add64(add64(h, S1), ch), K512L[i]), w[i]);
        var S0 = xor64(xor64(rr64(a,28), rr64(a,34)), rr64(a,39));
        var maj = xor64(xor64(and64(a,b), and64(a,c)), and64(b,c));
        var t2 = add64(S0, maj);
        h=g; g=f; f=e; e=add64(d,t1); d=c; c=b; b=a; a=add64(t1,t2);
      }
      H[0]=add64(H[0],a); H[1]=add64(H[1],b); H[2]=add64(H[2],c); H[3]=add64(H[3],d);
      H[4]=add64(H[4],e); H[5]=add64(H[5],f); H[6]=add64(H[6],g); H[7]=add64(H[7],h);
    }

    var out = [];
    for (var i = 0; i < 8; i++) out.push((H[i].h>>>24)&0xff,(H[i].h>>>16)&0xff,(H[i].h>>>8)&0xff,H[i].h&0xff,(H[i].l>>>24)&0xff,(H[i].l>>>16)&0xff,(H[i].l>>>8)&0xff,H[i].l&0xff);
    return toHex(out);
  }

  return {
    digest: function(algo, buf) {
      if (algo === 'SHA-1') return sha1(buf);
      if (algo === 'SHA-256') return sha256(buf);
      if (algo === 'SHA-512') return sha512(buf);
      return '';
    }
  };
})();

/**
 * ============================
 * Developer Config (ENUM-like)
 * ============================
 */
var HASH_ALGORITHMS = {
  SHA1: "SHA-1",
  SHA256: "SHA-256",
  SHA512: "SHA-512"
};

var currentAlgo = HASH_ALGORITHMS.SHA256;

var showDropdown = document.querySelector('meta[name="show-algo-dropdown"]').content === 'true';
var algoSection = document.getElementById('algoSection');
if (!showDropdown) algoSection.style.display = 'none';

/**
 * Populate dropdown
 */
var algoSelect = document.getElementById("algoSelect");
var algoKeys = Object.keys(HASH_ALGORITHMS);
for (var i = 0; i < algoKeys.length; i++) {
  var key = algoKeys[i];
  var val = HASH_ALGORITHMS[key];
  var opt = document.createElement("option");
  opt.value = val;
  opt.textContent = key;
  if (val === currentAlgo) opt.selected = true;
  algoSelect.appendChild(opt);
}

function updateLabels() {
  var name = algoSelect.options[algoSelect.selectedIndex].text;
  document.getElementById('expectedLabel').textContent = 'Expected ' + name;
  document.getElementById('computedLabel').textContent = 'Computed ' + name;
  document.title = name + ' Calculator';
  document.getElementById('pageHeading').textContent = name + ' Calculator';
}

algoSelect.addEventListener("change", function(e) {
  currentAlgo = e.target.value;
  updateLabels();
  document.getElementById('resetBtn').click();
});

/**
 * UI Elements
 */
var dropzone = document.getElementById("dropzone");
var fileInput = document.getElementById("fileInput");
var hashOutput = document.getElementById("hashOutput");
var result = document.getElementById("result");
var expectedHashInput = document.getElementById("expectedHash");
var verifyBtn = document.getElementById('verifyBtn');
var resetBtn = document.getElementById('resetBtn');

verifyBtn.disabled = true;
verifyBtn.style.opacity = '0.5';
verifyBtn.style.cursor = 'not-allowed';

function setResult(text, type) {
  result.textContent = text || '';
  if (!text) {
    result.className = 'result';
    result.style.display = 'none';
  } else {
    result.className = 'result ' + (type || '');
    result.style.display = 'block';
  }
}

var MAX_FILE_SIZE = 1024 * 1024 * 1024;

var isCalculating = false;
var activeReader = null;
var calcSession = 0;

expectedHashInput.addEventListener("keydown", function(e) {
  if (e.which === 13) e.preventDefault();
});

/**
 * Drag & Drop
 */
dropzone.addEventListener("click", function() { fileInput.click(); });

dropzone.addEventListener("dragover", function(e) {
  e.preventDefault();
  dropzone.className = 'dropzone dragover';
});

dropzone.addEventListener("dragleave", function() {
  dropzone.className = 'dropzone';
});

dropzone.addEventListener("drop", function(e) {
  e.preventDefault();
  dropzone.className = 'dropzone';
  handleFile(e.dataTransfer.files[0]);
});

fileInput.addEventListener("change", function(e) {
  handleFile(e.target.files[0]);
});

/**
 * Hash Calculation
 */
function handleFile(file) {
  if (!file || isCalculating) return;

  if (file.size > MAX_FILE_SIZE) {
    setResult('\u26A0 File too large. Maximum size is 1 GB.', 'warning');
    return;
  }

  isCalculating = true;
  calcSession++;
  var mySession = calcSession;
  dropzone.style.pointerEvents = 'none';
  dropzone.style.opacity = '0.5';
  expectedHashInput.value = '';
  hashOutput.textContent = 'Calculating...';
  setResult('\u23F3 Calculating hash, please hold on...', 'warning');
  document.getElementById('fileName').textContent = file.name;

  var chunkSize = 8 * 1024 * 1024;
  var offset = 0;
  var state = null;
  var w256 = new Int32Array(64);
  var w1 = new Int32Array(80);

/**
 * Validation
 */
function validate(calculated) {
  var expected = expectedHashInput.value.trim().toLowerCase();

  if (!expected) return;

  if (calculated === expected) {
    setResult('\u2705 Hashes match!', 'match');
  } else {
    setResult('\u274C Hashes do not match.', 'mismatch');
  }
}

/**
 * Verify & Reset buttons
 */
verifyBtn.addEventListener('click', function() {
  var computed = hashOutput.textContent;
  if (!computed || computed === 'Hash will appear after file upload') {
    setResult('\u26A0 Please upload a file first.', 'warning');
    return;
  }
  if (!expectedHashInput.value.trim()) {
    setResult('\u26A0 Please enter an expected hash.', 'warning');
    return;
  }
  validate(computed);
});

resetBtn.addEventListener('click', function() {
  var wasBusy = isCalculating;
  calcSession++;
  if (activeReader) {
    activeReader.onload = null;
    activeReader.onerror = null;
    activeReader = null;
  }
  isCalculating = false;
  dropzone.style.pointerEvents = 'auto';
  dropzone.style.opacity = '1';
  fileInput.value = '';
  expectedHashInput.value = '';
  hashOutput.innerHTML = 'Hash will appear after file upload';
  document.getElementById('fileName').innerHTML = '';
  document.getElementById('dropText').innerHTML = 'Drag &amp; drop a file here, or click to browse';
  verifyBtn.disabled = true;
  verifyBtn.style.opacity = '0.5';
  verifyBtn.style.cursor = 'not-allowed';
  if (wasBusy) {
    var resetSession = calcSession;
    setResult('\u26A0 Cancelling...', 'warning');
    setTimeout(function() {
      if (resetSession === calcSession) setResult('');
    }, 800);
  } else {
    setResult('');
  }
});
